<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Download BetPhile</title>


    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:

                radial-gradient(
                    circle at top,
                    #18202c,
                    #080b10 65%
                );

            color: white;

        }



        /* Background glow */

        body::before {

            content: "";

            position: fixed;

            width: 450px;

            height: 450px;

            background:
                rgba(255, 72, 20, 0.12);

            filter:
                blur(100px);

            border-radius: 50%;

            top: -150px;

            right: -100px;

            z-index: -1;

        }



        body::after {

            content: "";

            position: fixed;

            width: 400px;

            height: 400px;

            background:
                rgba(255, 174, 0, 0.08);

            filter:
                blur(100px);

            border-radius: 50%;

            bottom: -150px;

            left: -100px;

            z-index: -1;

        }



        /* Main card */

        .download-card {

            width: 100%;

            max-width: 480px;

            text-align: center;

            padding: 40px 30px;

            border-radius: 28px;

            background:

                rgba(
                    255,
                    255,
                    255,
                    0.05
                );

            border:

                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            box-shadow:

                0 30px 80px
                rgba(
                    0,
                    0,
                    0,
                    0.5
                );

            backdrop-filter:
                blur(20px);

        }



        /* Logo */

        .logo-box {

            width: 150px;

            height: 150px;

            margin:
                0 auto 25px;

            border-radius: 30px;

            overflow: hidden;

            box-shadow:

                0 15px 35px
                rgba(
                    255,
                    75,
                    20,
                    0.25
                );

        }


        .logo-box img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }



        /* Title */

        .download-card h1 {

            font-size: 32px;

            margin-bottom: 10px;

            font-weight: 700;

        }


        .download-card h1 span {

            color:
                #ff4b21;

        }



        /* Description */

        .description {

            color:
                #aeb6c2;

            font-size: 16px;

            line-height: 1.6;

            margin-bottom: 25px;

        }



        /* App Info */

        .app-info {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 18px;

            margin-bottom: 25px;

            border-radius: 16px;

            background:

                rgba(
                    255,
                    255,
                    255,
                    0.05
                );

            border:

                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.06
                );

        }



        .app-info-left {

            display: flex;

            align-items: center;

            gap: 13px;

            text-align: left;

        }



        .app-icon {

            width: 50px;

            height: 50px;

            display: flex;

            justify-content: center;

            align-items: center;

            border-radius: 14px;

            background:

                linear-gradient(
                    135deg,
                    #ff4b21,
                    #ff9818
                );

            font-size: 22px;

        }



        .app-name {

            font-size: 16px;

            font-weight: 600;

        }


        .app-version {

            margin-top: 5px;

            color:
                #8c95a1;

            font-size: 13px;

        }



        .file-size {

            padding:
                8px 12px;

            border-radius:
                10px;

            color:
                #ffb000;

            font-size:
                14px;

            font-weight:
                600;

            background:

                rgba(
                    255,
                    176,
                    0,
                    0.1
                );

        }



        /* Buttons */

        .btn {

            width: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            padding: 19px;

            margin-top: 14px;

            border-radius: 16px;

            text-decoration: none;

            font-size: 17px;

            font-weight: 600;

            transition:
                0.25s ease;

        }



        /* Direct Download */

        .download-btn {

            color: white;

            background:

                linear-gradient(
                    135deg,
                    #ff4b21,
                    #e3260d
                );

            box-shadow:

                0 12px 30px
                rgba(
                    255,
                    60,
                    20,
                    0.25
                );

        }


        .download-btn:hover {

            transform:
                translateY(-3px);

            box-shadow:

                0 18px 35px
                rgba(
                    255,
                    60,
                    20,
                    0.4
                );

        }



        /* Telegram */

        .telegram-btn {

            color: white;

            background:

                rgba(
                    255,
                    255,
                    255,
                    0.06
                );

            border:

                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.1
                );

        }


        .telegram-btn i {

            color:
                #2AABEE;

            font-size:
                22px;

        }


        .telegram-btn:hover {

            transform:
                translateY(-3px);

            background:

                rgba(
                    42,
                    171,
                    238,
                    0.1
                );

        }



        /* Footer text */

        .footer-text {

            margin-top: 25px;

            font-size: 13px;

            color:
                #737c87;

        }



        /* Mobile */

        @media (
            max-width: 480px
        ) {

            .download-card {

                padding:
                    30px 20px;

            }


            .download-card h1 {

                font-size:
                    27px;

            }


            .logo-box {

                width:
                    125px;

                height:
                    125px;

            }


            .app-info {

                padding:
                    14px;

            }


            .file-size {

                font-size:
                    12px;

            }

        }

    </style>

</head>

        <div class="footer-text">

        </div>

    <script>

</html>
