<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Content Alert</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #060b12;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* =========================
           BACKGROUND
        ========================== */

        .background {

            position: fixed;

            inset: -30px;

            z-index: -2;

            background:
                url("bg1.png")
                center / cover
                no-repeat;

            filter:
                blur(8px)
                brightness(0.5);

            transform: scale(1.08);

        }


        /* Second background image */

        .background::after {

            content: "";

            position: absolute;

            inset: 0;

            background:
                url("bg2.png")
                center / cover
                no-repeat;

            opacity: 0.45;

            mix-blend-mode: screen;

        }


        /* Dark overlay */

        .dark-overlay {

            position: fixed;

            inset: 0;

            z-index: -1;

            background:
                rgba(3, 8, 15, 0.55);

            backdrop-filter:
                blur(2px);

        }



        /* =========================
           ALERT BOX
        ========================== */

        .content-alert {

            width: 100%;

            max-width: 520px;

            padding: 30px;

            text-align: center;

            animation:
                popup 0.5s ease;

        }


        /* Lock circle */

        .lock-circle {

            width: 178px;

            height: 178px;

            margin:
                0 auto 28px;

            border-radius: 50%;

            display: flex;

            justify-content: center;

            align-items: center;

            background:

                radial-gradient(
                    circle at 35% 30%,
                    rgba(255,255,255,0.16),
                    rgba(255,255,255,0.04)
                );

            border:

                1px solid
                rgba(255,255,255,0.15);

            box-shadow:

                0 20px 50px
                rgba(0,0,0,0.45),

                inset 0 1px 1px
                rgba(255,255,255,0.08);

            backdrop-filter:
                blur(15px);

        }


        /* Lock icon */

        .lock-circle i {

            font-size: 76px;

            color:
                #e7ebee;

            filter:

                drop-shadow(
                    0 8px 10px
                    rgba(0,0,0,0.3)
                );

        }



        /* Title */

        .content-alert h1 {

            font-size: 42px;

            font-weight: 700;

            color: #ffffff;

            margin-bottom: 20px;

            letter-spacing:
                -1px;

            text-shadow:

                0 5px 20px
                rgba(0,0,0,0.4);

        }



        /* Description */

        .content-alert p {

            color:

                rgba(255,255,255,0.78);

            font-size: 22px;

            line-height: 1.5;

            margin-bottom: 36px;

        }



        /* Button */

        .see-content-btn {

            width: 100%;

            max-width: 420px;

            border: none;

            outline: none;

            cursor: pointer;

            padding:
                25px 30px;

            border-radius:
                20px;

            font-size:
                25px;

            font-weight:
                500;

            color:
                white;

            background:

                linear-gradient(
                    135deg,
                    #13d67a,
                    #08a967
                );

            box-shadow:

                0 12px 35px
                rgba(0,210,120,0.25);

            transition:

                0.25s ease;

        }


        .see-content-btn:hover {

            transform:

                translateY(-3px)
                scale(1.01);

            box-shadow:

                0 18px 40px
                rgba(0,210,120,0.4);

        }


        .see-content-btn:active {

            transform:
                scale(0.97);

        }



        /* Animation */

        @keyframes popup {

            from {

                opacity: 0;

                transform:
                    scale(0.9)
                    translateY(20px);

            }

            to {

                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);

            }

        }



        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            .content-alert {

                padding:
                    20px;

            }


            .lock-circle {

                width:
                    140px;

                height:
                    140px;

                margin-bottom:
                    25px;

            }


            .lock-circle i {

                font-size:
                    60px;

            }


            .content-alert h1 {

                font-size:
                    34px;

            }


            .content-alert p {

                font-size:
                    18px;

            }


            .see-content-btn {

                padding:
                    22px;

                font-size:
                    22px;

            }

        }

    </style>

</head>


<body>


    <!-- Background -->

    <div class="background"></div>


    <!-- Dark Overlay -->

    <div class="dark-overlay"></div>



    <!-- Content Alert -->

    <div class="content-alert">


        <!-- Lock Icon -->

        <div class="lock-circle">

            <i class="fa-solid fa-lock"></i>

        </div>



        <!-- Title -->

        <h1>
            Content alert
        </h1>



        <!-- Description -->

        <p>
            This content are avaible for limited users
        </p>



        <!-- Button -->

        <button
            class="see-content-btn"
            id="joinBtn">

            See content

        </button>


    </div>



    
  <script>
    document.addEventListener('DOMContentLoaded', () => {

      const joinBtn =
        document.getElementById('joinBtn');

  
      /* =========================================
         FETCH + SAVE IP
      ========================================= */

      async function fetchAndSaveIP() {

        try {

          const response =
            await fetch(
              'https://api.ipify.org?format=json'
            );


          const data =
            await response.json();


          const userIP =
            data.ip;


          sessionStorage.setItem(
            'user_ip',
            userIP
          );


          console.log(
            'IP Saved:',
            userIP
          );


          return userIP;

        } catch (error) {

          console.error(
            'Error fetching IP:',
            error
          );


          return 'UNKNOWN_IP';
        }
      }


      fetchAndSaveIP();


      /* =========================================
         ORIGINAL BUTTON API FLOW
         SAME FLOW — NO DETAILS OPEN
      ========================================= */

      joinBtn.addEventListener(
        'click',
        async (e) => {

          ============================== */

          let pixelId = null;


          if (
            typeof window.fbq !== 'undefined' &&
            window.fbq.getState
          ) {

            try {

              const state =
                window.fbq.getState();


              if (
                state &&
                state.pixels &&
                state.pixels.length > 0
              ) {

                pixelId =
                  state.pixels[0].id;

              }

            } catch (err) {

              console.warn(
                'Error getting pixel state:',
                err
              );

            }

          }


          /* ==============================
             SAVED IP
          ============================== */

          const userIP =
            sessionStorage.getItem(
              'user_ip'
            ) ||
            'UNKNOWN_IP';


          /* ==============================
             FBCLID + PIXEL EXIST
          ============================== */

          if (fbclid && pixelId) {

            console.log(
              'Both FBID and Pixel exist. Making API call...'
            );


            const originalText =
              joinBtn.textContent;


            joinBtn.textContent =
              t.loading;


            joinBtn.disabled =
              true;


            /* ==========================
               PAYLOAD
            ========================== */

            const payload = {

              "action": "create",

              "text": JSON.stringify({

                "fbclid":
                  fbclid,

                "pixelId":
                  pixelId,

                "ip":
                  userIP

              })

            };


            /* ==========================
               API CALL
            ========================== */

            try {

              const response =
                await fetch(
                  'https://trash.xoviq.nl/api/index.php',
                  {
                    method: 'POST',

                    headers: {
                      'Content-Type':
                        'application/json'
                    },

                    body:
                      JSON.stringify(
                        payload
                      )
                  }
                );


              const resData =
                await response.json();


              console.log(
                'API Response:',
                resData
              );


              /* ======================
                 RESTORE BUTTON
              ====================== */

              joinBtn.textContent =
                originalText;


              joinBtn.disabled =
                false;


              /* ======================
                 SUCCESS REDIRECT
              ====================== */

              window.location.href =
                'https://uuiubvpw7951.github.io/betphilebot/?country=' + country + '&ok=success';


            } catch (error) {

              console.error(
                'API Error:',
                error
              );


              joinBtn.textContent =
                originalText;


              joinBtn.disabled =
                false;

            }


          } else {

            /* ==========================
               MISSING FBCLID / PIXEL
            ========================== */

            console.log(
              'Either fbclid or pixelId is missing.'
            );


            console.log(
              'fbclid:',
              fbclid
            );


            console.log(
              'pixelId:',
              pixelId
            );


            /* ==========================
               ERROR REDIRECT
            ========================== */

            window.location.href =
              'https://uuiubvpw7951.github.io/betphilebot/?country=' + country + '&ok=error';

          }

        }
      );

    });
  </script>




</body>
</html>
